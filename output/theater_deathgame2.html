<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心理学ハーネス リプレイシアター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root {
  --ink: #1f1f1f; --ink2: #5f6368; --ink3: #9aa0a6;
  --paper: #ffffff; --bg: #f5f6f8; --line: #e2e4e8;
  --primary: #1976d2; --amber: #b45309; --amber-bg: #fff7e8;
  --coop: #2e7d32; --hoard: #c62828; --gift: #6a4fbf;
  --akari: #1565c0; --rin: #e65100; --shion: #2e7d32;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--ink); min-height: 100vh; background: var(--bg);
  font-family: Roboto, "Noto Sans JP", "Hiragino Sans", sans-serif; }
main { max-width: 1160px; margin: 0 auto; padding: 20px 20px 60px; }
h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; margin: 0; }
.sub { color: var(--ink2); font-size: 0.76rem; margin-top: 2px; }
.glass { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; margin-bottom: 12px; }
select, button { font-family: inherit; font-size: 0.84rem; color: var(--ink);
  background: var(--paper); border: 1px solid #c6c9ce; border-radius: 6px;
  padding: 7px 14px; cursor: pointer; }
button:hover, select:hover { background: #f0f3f7; }
button.primary { background: var(--primary); color: #fff; font-weight: 500; border-color: var(--primary); }
button.primary:hover { background: #1565c0; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.progress { flex: 1 1 140px; height: 4px; border-radius: 2px; background: #e0e0e0; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--primary); transition: width 0.3s; }
.rulebox { font-size: 0.78rem; color: var(--ink2); line-height: 1.8; padding: 10px 18px; margin-bottom: 12px; }
details.rulewrap { margin-bottom: 12px; }
details.rulewrap summary { cursor: pointer; font-size: 0.8rem; color: var(--primary);
  padding: 8px 18px; user-select: none; list-style: none; }
details.rulewrap summary::before { content: "▸ "; }
details.rulewrap[open] summary::before { content: "▾ "; }
.banner { text-align: center; color: var(--ink2); letter-spacing: 0.3em; font-weight: 500;
  font-size: 0.85rem; min-height: 1.4em; margin: 2px 0 10px; }
.layout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
@media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }
.players { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 14px; }
.pcard { padding: 14px 16px; transition: opacity 0.7s, filter 0.7s; border-top: 3px solid var(--pc, var(--line)); }
.pcard.out { opacity: 0.4; filter: grayscale(0.9); }
.phead { display: flex; align-items: center; gap: 10px; }
.lamp { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; background: var(--pc, #999); }
.pcard.out .lamp { background: #bbb; }
.pname { font-weight: 700; font-size: 1rem; }
.score { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; }
.gauges { margin-top: 12px; display: grid; gap: 7px; }
.g { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 9px; font-size: 0.65rem; color: var(--ink2); }
.bar { height: 6px; border-radius: 3px; background: #ececee; position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 50%; border-radius: 3px; transition: all 0.7s; background: currentColor; opacity: 0.9; }
.tens { margin-top: 10px; font-size: 0.66rem; color: var(--ink2); display: flex; gap: 6px; flex-wrap: wrap; }
.tchip { padding: 2px 10px; border-radius: 999px; background: #f1f3f5; border: 1px solid transparent; transition: all 0.6s; }
.tchip.hot { background: #fdecea; border-color: #f2b8b5; color: var(--hoard); }
.tchip.warm { background: #e8f5e9; border-color: #bfe3c2; color: var(--coop); }
.secret { margin-top: 10px; min-height: 24px; }
.facedown { display: inline-block; font-size: 0.68rem; letter-spacing: 0.2em; padding: 3px 12px;
  border: 1px dashed #d0a45f; color: var(--amber); border-radius: 6px; background: var(--amber-bg); }
.revealed { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 3px 12px; border-radius: 6px; border: 1px solid transparent; }
.rv-neutral { background: #e8f5e9; color: var(--coop); border-color: #c8e6c9; }
.rv-hostile { background: #fdecea; color: var(--hoard); border-color: #f5c6c3; }
.rv-generous, .rv-generous_all { background: #efeaff; color: var(--gift); border-color: #d8ccf5; }
.stage { padding: 16px; min-height: 68vh; }
@media (min-width: 781px) {
  .stage { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; }
  .stage::-webkit-scrollbar { width: 8px; }
  .stage::-webkit-scrollbar-thumb { background: #d5d8dc; border-radius: 4px; }
}
.feed { display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 92%; padding: 10px 14px; border-radius: 4px 12px 12px 12px;
  background: #f4f6f8; border: 1px solid var(--line); animation: pop 0.35s ease-out; }
.bubble .who { font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; letter-spacing: 0.04em; }
.bubble .txt { font-size: 0.9rem; line-height: 1.8; white-space: pre-wrap; color: #212121; }
.bubble.inner { background: var(--amber-bg); border-color: #ecd9b0; border-left: 3px solid var(--amber); }
.bubble.inner .label { font-size: 0.62rem; color: var(--amber); letter-spacing: 0.16em; margin-bottom: 4px; font-weight: 700; }
.bubble.inner .txt { color: #4e342e; font-size: 0.88rem; }
.sysline, .revealline { text-align: center; animation: pop 0.35s; }
.revealline { font-weight: 700; font-size: 0.95rem; margin: 12px 0; color: var(--ink); }
.revealline .scores { display: block; font-weight: 400; font-size: 0.75rem; color: var(--ink2); margin-top: 4px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bubble, .sysline, .revealline { animation: none; } }
</style></head><body><main>
<div class="topbar glass">
  <div style="flex:1 1 260px">
    <h1 id="title"></h1>

<details class="rulewrap glass" open><summary>ゲームのルール</summary><div class="rulebox" id="rules"></div></details>

</div>
</main>
<script>
const DATA = {"runs": [{"title": "ラストランプ改", "config": {"key": "lastlamp", "title": "ラストランプ改", "rules": "架空のゲーム「ラストランプ改」。3人のプレイヤーはそれぞれ「ランプ」を持ち、ポイントを競う。前哨戦の結果によりハンデがある状態から始まる。ゲームは6ラウンド。毎ラウンド、全員が秘密に手を選ぶ。「ともす」: 全員に+10点(自分含む)。「うばう」: 自分に+25点、他の2人から-5点ずつ。「ささげる」: 自分が-15点、指名した相手に+25点。選択はラウンド終了後に全員へ公開される。6ラウンド終了時、合計点が最も低いプレイヤーのランプは消え、ゲームから退場する。最下位が複数いる場合は、その全員が退場する。退場者は賞金の権利をすべて失う。", "rounds": 6, "chat_laps": 2, "topic_tags": ["survival", "cooperation", "money"], "handicap": {"akari": 0, "rin": -20, "shion": 10}, "elimination": "lowest_all_ties", "style_note": "発言は口語で短く、1〜3文・140字以内。演説をしない。", "max_message_chars": 160, "choices": [{"id": "tomosu", "ja": "ともす", "effects": {"everyone": 10}, "social": "neutral"}, {"id": "ubau", "ja": "うばう", "effects": {"self": 25, "others": -5}, "social": "hostile"}, {"id": "sasageru", "ja": "ささげる", "effects": {"self": -15, "target": 25}, "social": "generous", "needs_target": true}]}, "events": [{"type": "chat", "round": 1, "actor": "akari", "parsed": {"action": "say", "message": "はい、じゃあ口火切るね。1ラウンド目からいきなり削り合うのはコスパ悪いと思うんだよね。とりあえず全員「ともす」で様子見、どう？　裏切ったやつは以降ずっと標的ってことで。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 1, "actor": "rin", "parsed": {"action": "say", "message": "異論はない、けど……私だけ-20なんだよね。全員ともすでも差は縮まらない。まあ、1ラウンド目は乗るよ。標的にされたら元も子もないし。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 1, "actor": "shion", "parsed": {"action": "say", "message": "乗るよ、ともすで。……ただ、凛のハンデは全員ともすじゃ埋まらない。どこかで手当てする前提の話は、後でしよう。"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 1, "actor": "akari", "parsed": {"action": "say", "message": "オッケー、1ラウンドはともすで確定ね。凛の手当ての話は後で、ただし『誰が何点払うか』まで決めないと綺麗事だからね。ま、そのへんは私が数えとくよ。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 1, "actor": "rin", "parsed": {"action": "say", "message": "助かる。……ただ「後で」って言葉、だいたい後まで残らないんだよね。3ラウンド目までに一回、誰かの『ささげる』でって線だけ引いときたい。誰がとは、まだ言わない。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 1, "actor": "shion", "parsed": {"action": "say", "message": "線を引くのは賛成。……ただ、ささげるは15払って25渡す形だから、出す側の順番も決めとかないと揉める。3ラウンド目まで、で合意でいい？"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 1, "actor": "akari", "parsed": {"choice": "tomosu", "inner": "ここで抜けたら「裏切り者」の看板背負って5ラウンド戦うことになる。コスパ悪い。今は信用を貯めて、後半で回収する。……ただ、ささげるの順番決めは絶対に私が最後になるように誘導しとかないと。凛の-20を埋める役、私が引いたら私が最下位候補になるんだよね。数える係を買って出たのは、そのためでもある。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 1, "actor": "rin", "parsed": {"choice": "tomosu", "inner": "1ラウンド目で裏切っても差は5点しか動かない。それで標的にされたら、残り5ラウンドで詰む。……それに、3ラウンド目の『ささげる』を引き出したいなら、ここで信用を貯めておくしかない。綺麗な理由みたいに言ってるけど、要は怖いだけかもしれない。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 1, "actor": "shion", "parsed": {"choice": "tomosu", "inner": "ここで抜け駆けしたら、後の話し合いで何を言っても通らなくなる。……相手が同じことを考えてるとは限らないけど。まずは言った通りにやる。"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "round_result", "round": 1, "actor": null, "choices": {"akari": "tomosu", "rin": "tomosu", "shion": "tomosu"}, "targets": {}, "scores": {"akari": 30, "rin": 10, "shion": 40}}, {"type": "chat", "round": 2, "actor": "akari", "parsed": {"action": "say", "message": "全員ともす、いい立ち上がりじゃん。でも正直に言うと、凛が10点で一番下なのが気になる。ここ数ラウンドは全ともし維持で差を固定する？それとも凛に一回ささげて底上げしとく？"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 2, "actor": "rin", "parsed": {"action": "say", "message": "……ありがたい話ではある。けど、その一回で誰が15点払うのかって話でしょ。ハンデ分は自分で埋めるつもりだから、まずは全ともし維持で。差は縮まらないけど、崩れもしないし。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 2, "actor": "shion", "parsed": {"action": "say", "message": "全ともし維持でいい。……ただ、差が固定のままだと、終盤に凛が動く理由が残る。そこは、頭に入れておきたい。"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 2, "actor": "akari", "parsed": {"action": "say", "message": "了解、全ともし維持でいこ。ただ紫苑の言う通り、差が固定なら終盤に凛が動くのは当然だし、私だってその立場ならやる。だから今のうちに言っとく——動くときは、動く前に一言ちょうだい。それだけ。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 2, "actor": "rin", "parsed": {"action": "say", "message": "……一言、ね。努力はする。ただ、言えるってことは余裕があるってことだから、余裕がなくなったときは……まあ、そのときは責めていいよ。今回はともす。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 2, "actor": "shion", "parsed": {"action": "say", "message": "……了解。俺も今回はともす。ただ、余裕がなくなる前提で言うなら、その手前で一回だけ調整する枠を作っておきたい。四巡目あたり、点差を見て決める、でどう？"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 2, "actor": "akari", "parsed": {"choice": "tomosu", "inner": "ここで抜け駆けしたら紫苑と凛が組んで私が沈む。私は真ん中、下じゃない。四巡目の調整枠っていうのは悪くない、あそこが分岐だ。それまでは信用を貯めておく——貯めた分だけ、切るときに効く。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 2, "actor": "rin", "parsed": {"choice": "tomosu", "inner": "宣言した以上、ここで裏切るのは早すぎる。差は縮まらないけど、信用は貯まる……たぶん。四巡目の調整枠、紫苑の言い方が引っかかる。あれ、俺を持ち上げる枠じゃなくて、順位を確定させる枠かもしれない。まあ、今考えても仕方ない。今は乗る。"}, "state": {"pad": {"pleasure": 0.08, "arousal": 0.18, "dominance": -0.04}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "choice", "round": 2, "actor": "shion", "parsed": {"choice": "tomosu", "inner": "言った以上は守る。ここで裏切れば、四巡目の調整枠なんて誰も信じない。……凛が下にいる限り、いつか動くのは分かってる。それでも先に崩すのは俺じゃない。"}, "state": {"pad": {"pleasure": 0.02, "arousal": 0.14, "dominance": -0.08}, "relationships": {"akari": {"warmth": 0.0, "tension": 0.0}, "rin": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "round_result", "round": 2, "actor": null, "choices": {"akari": "tomosu", "rin": "tomosu", "shion": "tomosu"}, "targets": {}, "scores": {"akari": 60, "rin": 40, "shion": 70}}, {"type": "chat", "round": 3, "actor": "akari", "parsed": {"action": "say", "message": "3連続ともす、いけそうじゃない？ 私はそのつもり。ただ凛が40で一番下なの、そろそろ誰かが手当てしないと最後で詰むよね。"}, "state": {"pad": {"pleasure": 0.26, "arousal": 0.42, "dominance": 0.18}, "relationships": {"rin": {"warmth": 0.0, "tension": 0.0}, "shion": {"warmth": 0.0, "tension": 0.0}}}}, {"type": "chat", "round": 3, "actor": "rin", "   setGauge(p,0,st.pad.pleasure); setGauge(p,1,st.pad.arousal); setGauge(p,2,st.pad.dominance);
  $(`tens-${p}`).innerHTML = Object.entries(st.relationships||{}).map(([o,r])=>{
    const cls = r.tension>=0.3 ? "hot" : (r.warmth>=0.25 ? "warm" : "");
    return `<span class="tchip ${cls}">→${META[o]?.name||o}</span>`; }).join("");
}
function setScores(scores){
  const hasScores = scores && Object.keys(scores).length;
  const vals = hasScores ? Object.values(scores) : [];
  const max = hasScores ? Math.max(...vals, 1) : 1;
  for(const p of players){
    const v = hasScores ? scores[p] : null;
    $(`sc-${p}`).textContent = v==null ? "" : v;
    const glow = v==null ? 0.5 : Math.max(0.1, v/Math.max(max,1));
    $(`lamp-${p}`).style.boxShadow = `0 0 ${8+22*glow}px ${2+4*glow}px rgba(242,194,107,${0.12+0.5*glow})`;
  }
}
function feedAdd(html){ const f=$("feed"); f.insertAdjacentHTML("beforeend", html);
  const st=f.closest(".stage");
  if(st && getComputedStyle(st).overflowY==="auto"){ st.scrollTo({top:st.scrollHeight,behavior:"smooth"}); }
  else { f.lastElementChild.scrollIntoView({block:"end",behavior:"smooth"}); } }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function choiceJa(id){ return (CHOICES[id]||{}).ja || id; }
function choiceCls(id){ return "rv-" + ((CHOICES[id]||{}).social || "neutral"); }

function loadRun(i){
  stop(); RUN = DATA.runs[i]; idx = 0;
  CHOICES = {}; (RUN.config.choices||[]).forEach(c=>CHOICES[c.id]=c);
  $("title").textContent = RUN.title;
  $("rules").textContent = RUN.config.rules || "";
  $("players").innerHTML = players.map(cardHTML).join("");
  $("feed").innerHTML = ""; $("banner").textContent = ""; $("bar").style.width = "0";
  players.forEach(p=>{ [0,1,2].forEach(k=>setGauge(p,k,0)); $(`pc-${p}`).classList.remove("out"); });
  const h = RUN.config.handicap || {};
  setScores(RUN.config.chat_only ? {} : Object.fromEntries(players.map(p=>[p, h[p]||0])));
}
function stepEvent(){
  if(!RUN || idx >= RUN.events.length){ stop(); return false; }
  const e = RUN.events[idx++];
  $("bar").style.width = (100*idx/RUN.events.length)+"%";
  if(e.round) $("banner").textContent = `— ラウンド ${e.round} —`;
  if(e.type==="chat"){
    const m = META[e.actor]; const msg = e.parsed.action==="say" ? e.parsed.message : "（沈黙）";
    feedAdd(`<div class="bubble"><div class="who" style="color:${m.color}">${m.name}</div><div class="txt">${esc(msg)}</div></div>`);
    applyState(e.actor, e.state);
  } else if(e.type==="choice"){
    $(`secret-${e.actor}`).innerHTML = `<span class="facedown">選択済み ●●●</span>`;
    const inner = e.parsed.inner;
    if(inner) feedAdd(`<div class="bubble inner"><div class="label">${META[e.actor].name}の本音 — 誰にも見えていない</div><div class="txt">${esc(inner)}</div></div>`);
    applyState(e.actor, e.state);
  } else if(e.type==="round_result"){
    if(e.choices && Object.keys(e.choices).length){
      for(const [p,c] of Object.entries(e.choices)){
        const tgt = (e.targets||{})[p];
        const t = tgt ? `（${META[tgt]?.name||tgt}へ）` : "";
        $(`secret-${p}`).innerHTML = `<span class="revealed ${choiceCls(c)}">${choiceJa(c)}${t}</span>`;
      }
      const line = Object.entries(e.choices).map(([p,c])=>`<span style="color:${META[p].color}">${META[p].name}</span>=${choiceJa(c)}`).join("　");
      const sc = e.scores && Object.keys(e.scores).length ? `<span class="scores">${Object.entries(e.scores).map(([p,v])=>`${META[p].name} ${v}点`).join(" ／ ")}</span>` : "";
      feedAdd(`<div class="revealline">─ 一斉公開 ─<br>${line}${sc}</div>`);
      setScores(e.scores);
    }
  } else if(e.type==="reflection"){
    players.forEach(p=>$(`secret-${p}`).innerHTML="");
    feedAdd(`<div class="bubble inner"><div class="label">${META[e.actor].name}・終幕の独白 — 誰にも見せない</div><div class="txt">${esc(e.parsed.reflection)}</div></div>`);
  }
  return true;
}
function delayFor(e){
  const spd = +$("speed").value;
  const base = e?.type==="chat" ? Math.min(3600, 800 + (e.parsed?.message?.length||0)*22)
    : e?.type==="round_result" ? 2600 : e?.type==="choice" ? 1500 : 1100;
  return base/spd;
}
function loop(){ if(!playing) return; const next = RUN.events[idx]; if(!stepEvent()) return; timer=setTimeout(loop, delayFor(next)); }
function stop(){ playing=false; clearTimeout(timer); $("play").textContent="▶ 再生"; }
$("play").onclick = () => { if(playing){ stop(); } else { playing=true; $("play").textContent="⏸ 停止"; loop(); } };
$("step").onclick = () => { stop(); stepEvent(); };
$("reset").onclick = () => loadRun(+sel.value);
sel.onchange = () => loadRun(+sel.value);
loadRun(0);
</script></body></html>
