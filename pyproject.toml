[project]
name = "pneuma-lab"
version = "0.1.0"
description = "Psychological harness for LLM characters — does per-turn computed psychology make small-group agent interaction more human?"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pneuma_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
